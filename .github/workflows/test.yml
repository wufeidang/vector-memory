name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Cache modelscope models
      id: cache-models
      uses: actions/cache@v4
      with:
        path: ~/.cache/modelscope
        key: ${{ runner.os }}-modelscope-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-modelscope-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd scripts
        python -m pytest test_vector_memory.py -v --tb=short -x
      env:
        PYTHONIOENCODING: utf-8
